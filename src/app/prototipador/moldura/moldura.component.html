<header class="proto-topo">
  <button
    type="button"
    class="proto-topo__alternar"
    (click)="alternarMenu()"
    [attr.aria-expanded]="!recolhido()"
    [attr.aria-label]="recolhido() ? 'Abrir menu' : 'Fechar menu'"
  >
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.25" stroke="currentColor" stroke-width="1.3" />
      <line x1="5.25" y1="5.5" x2="5.25" y2="10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
    </svg>
  </button>

  <proto-seletor-idioma />
</header>

<nav class="proto-menu" aria-label="Prototipador">
  <ul class="proto-menu__lista">
    @for (item of itens(); track item.rotulo) {
      <li>
        <a
          class="proto-menu__item"
          [class.proto-menu__item--ativo]="item.ativo"
          [attr.aria-current]="item.ativo ? 'page' : null"
          [attr.aria-label]="item.rotulo"
          [href]="item.destino"
          (click)="navegar($event, item.destino)"
        >
          <i class="pi proto-menu__icone" [ngClass]="item.icone"></i>
          @if (!recolhido()) {
            <span class="proto-menu__rotulo">{{ item.rotulo }}</span>
          }
        </a>
      </li>
    }
  </ul>
</nav>

<main class="proto-conteudo">
  <router-outlet />
</main>
