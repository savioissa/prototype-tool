<form [formGroup]="form" (ngSubmit)="salvar()" class="tab-body" novalidate>
  <div class="tab-toolbar">
    @if (editing) {
      <p-button
        [label]="'portal.generic.button.cancel' | translate"
        type="button"
        styleClass="btn--md btn--neutral"
        [disabled]="saving"
        (onClick)="cancelar()"
      />
      <p-button
        [label]="'portal.generic.button.save' | translate"
        type="submit"
        styleClass="btn--md btn--primary"
        [disabled]="form.invalid || form.pristine"
        [loading]="saving"
      />
    } @else {
      <p-button
        [label]="'portal.generic.button.edit' | translate"
        icon="pi pi-pencil"
        type="button"
        styleClass="btn--md btn--primary"
        [disabled]="loading"
        (onClick)="editar()"
      />
    }
  </div>

  <app-branch-fields [group]="form" [loading]="loading" />
</form>

<!-- confirmação ao cancelar com alterações e ao sair da aba ou da página em edição -->
<p-confirmDialog styleClass="leave-dialog" [style]="{ width: '420px' }" />
