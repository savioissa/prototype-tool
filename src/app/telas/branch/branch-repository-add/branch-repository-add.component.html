<section class="insumo-layer add-panel" aria-labelledby="repository-add-title">
  <header class="add-panel__header">
    <h2 id="repository-add-title" class="t-title-sm add-panel__title">{{ 'iclass.generic.label.add-repository' | translate }}</h2>

    <div class="add-panel__actions">
      <p-button [label]="'portal.generic.button.cancel' | translate" styleClass="btn--md btn--neutral" [disabled]="saving" (onClick)="closed.emit()" />
      <p-button [label]="'portal.generic.button.save' | translate" styleClass="btn--md btn--primary" [disabled]="!podeSalvar" [loading]="saving" (onClick)="salvar()" />
    </div>
  </header>

  <app-branch-stock-partition-picker [selected]="almoxarifado" (selectedChange)="onAlmoxarifado($event)" />

  <!-- começa fechada; abre sozinha quando o almoxarifado é escolhido -->
  <app-branch-repository-picker class="add-panel__repository" [(selected)]="repositorio" />

  @if (duplicado) {
    <div class="form-alert">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ 'iclass.generic.label.repository-already-linked-to-stock-partition' | translate }}</span>
    </div>
  }
</section>
