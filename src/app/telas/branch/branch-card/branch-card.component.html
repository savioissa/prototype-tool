@if (loading || !branch) {
  <div class="skeleton card-skeleton" aria-hidden="true"></div>
} @else {
  <article class="reg-card branch-card">
    <div class="kv">
      <span class="kv-k">{{ 'iclass.generic.label.code' | translate }}</span>
      <span class="kv-v">{{ branch.codigo }}</span>
    </div>
    <div class="kv">
      <span class="kv-k">{{ 'iclass.generic.label.description' | translate }}</span>
      <span class="kv-v">{{ branch.descricao }}</span>
    </div>
    <p-button
      icon="pi pi-window-maximize"
      [text]="true"
      styleClass="btn--md btn--text icon-neutral"
      [loading]="opening"
      (onClick)="open.emit(branch)"
    />
  </article>
}
